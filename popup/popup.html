<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sesh Swapper</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="app">
    <div class="header">
      <div class="header-logo">
        <div class="logo-icon">⇄</div>
        <span class="logo-text">SESH SWAPPER</span>
      </div>
      <div class="active-domain" id="activeDomain">—</div>
    </div>

    <div class="section">
      <div class="section-label">SMART ACCESS</div>
      <div class="smart-access" id="smartAccess">
        <button class="sa-btn" data-domain="claude.ai" title="Claude">
          <img src="../icons/claude.png" class="sa-img" alt="Claude" />
          <span class="sa-name">Claude</span>
        </button>
        <button class="sa-btn" data-domain="chatgpt.com" title="ChatGPT">
          <img src="../icons/gpt.png" class="sa-img" alt="GPT" />
          <span class="sa-name">GPT</span>
        </button>
      </div>
    </div>

    <div class="section">
      <div class="section-label">NEW IDENTITY</div>
      <div class="capture-row">
        <input type="text" id="labelInput" class="label-input" placeholder="Label profil ini..." maxlength="32" />
        <div class="domain-badge" id="domainBadge">auto</div>
      </div>
      <button class="btn-capture" id="btnCapture">
        <span class="btn-capture-icon">⊕</span>
        Capture Session
      </button>
    </div>

    <div class="section">
      <div class="section-label-row">
        <div class="section-label">STORED PROFILES</div>
        <div class="profile-count" id="profileCount">0</div>
      </div>
      <div class="profiles-list" id="profilesList">
        <div class="empty-state">
          <div class="empty-icon">◌</div>
          <div class="empty-text">Belum ada profil tersimpan</div>
        </div>
      </div>
    </div>

    <div class="actions-row">
      <button class="btn-action" id="btnExportAll">Export All</button>
      <button class="btn-action" id="btnExportPick">Export Pick</button>
      <button class="btn-action btn-import" id="btnImport">Import</button>
    </div>

    <div class="toast" id="toast"></div>
  </div>

  <input type="file" id="importFile" accept=".json" style="display:none" />
  <script src="popup.js"></script>
</body>
</html>
